all: false

dir: '{{.InterfaceDir}}/mock'
filename: 'mocks_{{.InterfaceName | snakecase}}.gen.go'
force-file-write: true
formatter: goimports

formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
    
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'

packages:
  github.com/Sayfargo/gophermart-loyal-service/internal/accrual/goods/handler:
    config:
      all: true

  github.com/Sayfargo/gophermart-loyal-service/internal/accrual/goods/service:
    config:
      all: true